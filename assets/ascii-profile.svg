<svg xmlns="http://www.w3.org/2000/svg" width="772" height="585" viewBox="0 0 772 585">
<rect width="100%" height="100%" fill="#0d1117"/>
<style>
.ascii { font-family: "Courier New", Courier, monospace; font-size: 8px; font-weight: 700; fill: #58a6ff; white-space: pre; }
@keyframes reveal {
  from { opacity: 0; transform: translateY(-3px); }
  to { opacity: 1; transform: translateY(0); }
}
.row { opacity: 0; animation: reveal 0.18s ease-out forwards; }
@media (prefers-reduced-motion: reduce) {
  .row { opacity: 1; animation: none; }
}
</style>
