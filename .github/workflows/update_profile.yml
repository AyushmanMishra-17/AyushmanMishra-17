name: Update GitHub Profile

on:
  schedule:
    # Run once every day at 06:17 UTC
    - cron: "17 6 * * *"

  # Allow manual runs from GitHub Actions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Fetch GitHub contributions
        run: |
          python scripts/generate_contributions.py

      - name: Generate contribution SVG
        run: |
          python scripts/render_contributions.py

      - name: Commit updated profile assets
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: update contribution activity"
          file_pattern: |
            assets/contribution-heatmap.svg
            data/github_contributions.html